services:
  app:
    build: .
    container_name: app
    env_file: 
      - .env
    environment:
      CONN_STRING: ${CONN_STRING}
      DB_HOST: database
      REDIS_HOST: redis:6379
    depends_on:
      redis:
        condition: service_started
      database:
        condition: service_healthy
    restart: on-failure
    ports:
      - "9111:9111"

  database:
    image: postgres:18-bookworm
    container_name: db
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped 

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped 

volumes:
  pgdata:
  redis_data: